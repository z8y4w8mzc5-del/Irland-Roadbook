<script>
const days=[{"id": "tag1", "label": "Tag 1 · 31.08.", "route": "Dublin Airport → Ard na Sidhe", "subtitle": "Anreise · 16 Etappen", "sections": [{"title": "Start · Dublin Airport", "road": "Mietwagenzentrum → M50", "nav": "Bevor ihr losfahrt: Sitz, Spiegel und Fahrzeugbreite prüfen. Navi auf Ard na Sidhe, V93 HV57 stellen. Beim Vermieter klären, wie die M50-Maut abgerechnet wird.", "look": "Die ersten Kilometer sind Eingewöhnung. Fahrer konzentriert sich auf Linksverkehr; Beifahrer übernimmt Navi und Roadbook.", "story": "Willkommen in Irland. Dublin liegt an der Ostküste, aber heute durchquert ihr fast die ganze Insel bis in den Südwesten. Die Fahrt zeigt sehr schön, wie sich Irland von der dichter besiedelten Hauptstadtregion über die landwirtschaftlich geprägten Midlands bis zu den Bergen und Seen Kerrys verändert.", "extra": "M50-Maut: Die M50 arbeitet im mautpflichtigen Abschnitt ohne Schranken. Bei Mietwagen kann die Abrechnung je nach Vermieter unterschiedlich laufen. Deshalb ist die Frage am Schalter wichtiger als späteres Rätselraten.", "stop": false}, {"title": "Dublin umfahren", "road": "M50 · Richtung Süden", "nav": "Auf der M50 den Schildern Richtung Süden folgen. Das Navi hat hier Vorrang, weil Verkehr und Anschlussrouten variieren können.", "look": "Ihr umfahrt die Innenstadt westlich. An klaren Tagen zeichnen sich südlich die Wicklow Mountains ab.", "story": "Dublin wuchs an der Mündung des Liffey. Der irische Name Baile Átha Cliath bedeutet ungefähr 'Ort an der Furt der Flechtwerkhürden'. Der englische Name Dublin geht dagegen auf Dubh Linn, den 'schwarzen Teich', zurück. Schon an einem einzigen Ortsnamen sieht man, wie gälische und englische Geschichte nebeneinanderliegen.", "extra": "Beifahrer-Tipp: Auf Autobahnen sind Entfernungen in Kilometern und Geschwindigkeiten in km/h angegeben. Irische Wegweiser verwenden für Orte häufig die englische und die irische Namensform.", "stop": false}, {"title": "Auf die M7", "road": "M50 → M7 · Richtung Limerick", "nav": "Beim Wechsel auf die M7 ausdrücklich Richtung Limerick orientieren. Ab hier wird die Navigation für längere Zeit ruhiger.", "look": "Die dichte Hauptstadtregion lockert sich. Gewerbegebiete weichen Feldern, Hecken und kleineren Siedlungen.", "story": "Die M7 folgt grob einer der wichtigsten historischen Achsen von Dublin in den Südwesten. Moderne Autobahn und alte Reisewege liegen nicht identisch, aber die Logik ist dieselbe: Von der Ostküste führt der natürliche Verkehrskorridor durch die Midlands zum Shannon und weiter nach Munster.", "extra": "Irische Hecken sind nicht bloß Grundstücksgrenzen. Viele bilden alte Feldstrukturen ab und schaffen ein dichtes Netz aus kleinen Lebensräumen.", "stop": false}, {"title": "Kildare & The Curragh", "road": "M7 · County Kildare", "nav": "Auf der M7 bleiben. Kein Straßenwechsel nötig.", "look": "Achtet auf weite, offene Grasflächen. Die Gegend um Kildare und The Curragh ist eng mit Pferdezucht und Rennsport verbunden.", "story": "The Curragh ist eine große offene Ebene in County Kildare. Seit Jahrhunderten wird sie mit Pferden verbunden; heute ist Kildare eines der Zentren der irischen Vollblutzucht. Gleichzeitig war The Curragh auch militärisch bedeutend. Diese ungewöhnliche Mischung aus offenem Grasland, Pferdekultur und Militärgeschichte prägt die Region.", "extra": "Der Name Kildare stammt vom irischen Cill Dara: 'Kirche der Eiche'. Er erinnert an die heilige Brigid, eine der wichtigsten Gestalten des frühen irischen Christentums.", "stop": false}, {"title": "Midlands & Moore", "road": "M7 · Richtung Portlaoise", "nav": "Weiter auf der M7. Rock of Dunamase bleibt bis zur Entscheidung nur eine Option.", "look": "Die Landschaft wirkt flacher und weiter. In den Midlands liegen große Moorgebiete, darunter Teile des Bog of Allen.", "story": "Irlands Moore sind Landschaftsarchive. Über Jahrtausende sammelten sich Pflanzenreste in nassem, sauerstoffarmem Boden und wurden zu Torf. Torf war lange Brennstoff und Teil des Alltags. Heute stehen viele Moore im Mittelpunkt des Naturschutzes und der Renaturierung.", "extra": "Moore konservieren außergewöhnlich gut. Pollen, Holz und manchmal sogar menschliche Überreste erlauben Archäologen und Klimaforschern Einblicke weit zurück in die Vergangenheit.", "stop": false}, {"title": "Entscheidung · Rock of Dunamase", "road": "M7 · Raum Portlaoise", "nav": "Jetzt entscheiden: Rock of Dunamase besuchen oder auf der M7 bleiben. Für den Abstecher unbedingt die aktuelle Navi-Führung verwenden.", "look": "Der markante Kalksteinfelsen erhebt sich deutlich aus der Landschaft östlich von Portlaoise.", "story": "Dunamase war zunächst ein frühchristlicher Platz und wurde später zu einer der bedeutenden anglo-normannischen Festungen Irlands. 1170 gelangte Dunamase im Zusammenhang mit der Heirat von Aoife MacMurrough und Richard de Clare, bekannt als Strongbow, in die anglo-normannische Machtwelt.", "extra": "Die Lage erklärt fast alles: Von dem Felsen lässt sich das Umland hervorragend überblicken. Wer im Mittelalter Wege, Menschen und Vieh kontrollieren wollte, brauchte genau solche Plätze.", "stop": true}, {"title": "Nach Dunamase zurück zur Route", "road": "Zurück → M7 · Richtung Limerick", "nav": "Nach dem Besuch zurück zur M7 und ausdrücklich Richtung Limerick fahren. Nicht der Gegenrichtung Dublin folgen.", "look": "Beim Zurückfahren lohnt ein letzter Blick auf den Felsen: Aus der Ebene wirkt die strategische Lage besonders deutlich.", "story": "Die Ruinen erzählen keine einzige Epoche, sondern mehrere übereinanderliegende Geschichten: frühes Christentum, Wikingerzeit, irische Königtümer, normannische Expansion und spätere Zerstörungen. Genau diese Überlagerung ist typisch für historische Orte in Irland.", "extra": "Am Monument gibt es nur begrenzte Parkmöglichkeiten. Auf der schmalen Straße rund um den Zugang ist besondere Vorsicht nötig.", "stop": false}, {"title": "M7/M8-Verzweigung", "road": "M7 · Richtung Limerick", "nav": "Wichtig: An der großen Verzweigung auf der M7 Richtung Limerick bleiben. Die M8 führt Richtung Cork.", "look": "Ihr seid nun tief in den Midlands. Die Landschaft bleibt landwirtschaftlich, wird aber nach Westen langsam abwechslungsreicher.", "story": "Hier teilt sich der Verkehr in zwei große Südwestkorridore: Cork im Süden und Limerick/Shannon im Westen. Für eure Reise ist Limerick das Tor nach Kerry.", "extra": "Auf diesem Autobahnabschnitt liegt eine Mautstation. Für Pkw beträgt die M7/M8-Maut 2026 laut Transport Infrastructure Ireland 2,30 Euro.", "stop": false}, {"title": "Richtung Shannon", "road": "M7 · Counties Tipperary/Limerick", "nav": "Auf der M7 Richtung Limerick bleiben.", "look": "Westwärts werden Hügel und Höhenzüge sichtbarer. Ihr nähert euch dem Einzugsgebiet des Shannon.", "story": "Der Shannon ist der längste Fluss Irlands und seit jeher Verkehrsweg, Grenze und Landschaftsachse. Limerick entstand an einer strategisch wichtigen Stelle am Fluss, wo sich Handel, Verteidigung und später Industrie konzentrierten.", "extra": "Viele irische Landschaften versteht man besser über Wasser als über Straßen: Flüsse, Seen, Moore und die Atlantikküste bestimmten lange, wo Menschen siedelten und wie sie reisten.", "stop": false}, {"title": "Limerick", "road": "Umfahrung Limerick → Richtung N21/Kerry", "nav": "Der aktuellen Navi-Führung Richtung Kerry/Tralee folgen. Nicht in die Innenstadt fahren, sofern ihr keinen bewussten Stopp plant.", "look": "In der Region dominiert der Shannon. Je nach Route seht ihr Stadtgebiete, Flusslandschaft und die westlichen Ausläufer der Grafschaft.", "story": "Limerick entwickelte sich aus einer Wikingersiedlung und wurde später zu einer bedeutenden normannischen Stadt. King John's Castle erinnert an diese mittelalterliche Machtstellung. Die Stadt war außerdem Schauplatz der Williamitenkriege des 17. Jahrhunderts und ist deshalb eng mit dem 'Treaty of Limerick' verbunden.", "extra": "Heute ist Limerick die wichtigste Stadt im mittleren Westen Irlands. Für euren Ankunftstag dient sie vor allem als geografischer Wendepunkt: Ab hier fühlt sich die Reise zunehmend nach Westirland an.", "stop": false}, {"title": "Adare", "road": "N21 · westlich von Limerick", "nav": "Auf der N21 Richtung Kerry bleiben. Adare nur ansteuern, wenn Zeit und Energie passen.", "look": "Adare ist bekannt für reetgedeckte Cottages, historische Gebäude und ein sehr gepflegtes Ortsbild.", "story": "Adare verdankt einen Teil seines heutigen romantischen Erscheinungsbilds dem 19. Jahrhundert, als die Earls of Dunraven das Dorf prägten. Gleichzeitig reichen Kloster- und Burgspuren viel weiter zurück. Es ist also zugleich historischer Ort und bewusst gestaltetes 'picturesque village'.", "extra": "Wenn ihr spät dran seid, einfach durchfahren. Das Hotelziel am Caragh Lake ist der schönere Ort, um den ersten Reisetag ruhig ausklingen zu lassen.", "stop": true}, {"title": "West Limerick", "road": "N21 · Richtung Abbeyfeale/Kerry", "nav": "Weiter der N21 Richtung Kerry folgen.", "look": "Die Straße führt durch eine stärker ländliche Region. Kleine Orte, Weiden, Hecken und sanfte Hügel bestimmen das Bild.", "story": "West Limerick war traditionell stark landwirtschaftlich geprägt. Je näher ihr Kerry kommt, desto deutlicher verändert sich der Charakter: Die Ebenen und sanften Hügel der Midlands gehen langsam in eine dramatischere, atlantisch geprägte Landschaft über.", "extra": "Ein irisches Landschaftsdetail zum Beobachten: Viele Felder sind klein und von Hecken oder Steinmauern getrennt. Die Parzellen erzählen oft mehr über Besitzgeschichte als eine moderne Landkarte.", "stop": false}, {"title": "Willkommen in Kerry", "road": "N21/N23 · Richtung Castleisland", "nav": "Den Navi-Hinweisen Richtung Castleisland und anschließend Richtung Killorglin folgen. Ab hier können Straßenwechsel häufiger werden.", "look": "Berge rücken näher. Kerry wirkt grüner, bewegter und deutlich stärker vom Atlantik geprägt.", "story": "County Kerry ist eines der landschaftlich spektakulärsten Gebiete Irlands. Die Berge bestehen zu großen Teilen aus sehr altem Gestein; Eiszeiten formten Täler und Seen. Im Südwesten liegen die höchsten Berge der Insel, darunter Carrauntoohil.", "extra": "Kerry heißt auf Irisch Ciarraí, benannt nach dem alten Volk der Ciarraige. Viele Ortsnamen, die ihr jetzt seht, tragen die gälische Sprachgeschichte noch deutlich in sich.", "stop": false}, {"title": "Richtung Killorglin", "road": "Region Castleisland → Killorglin", "nav": "Aktuelle Navigation nach Killorglin folgen. Hier nicht mehr nur nach einer einzelnen Straßennummer fahren.", "look": "Jetzt wird die Landschaft zum Auftakt der Iveragh Peninsula: Berge, tiefe Täler und im Westen der Einfluss des Atlantiks.", "story": "Killorglin liegt am River Laune, der aus den Seen von Killarney Richtung Dingle Bay fließt. Der Ort ist besonders für die Puck Fair bekannt, ein traditionsreiches Fest, bei dem symbolisch ein Ziegenbock zum 'King Puck' gekrönt wird.", "extra": "Für euch ist Killorglin heute das letzte größere Orientierungszentrum. Danach wird die Fahrt zum Caragh Lake ruhiger und ländlicher.", "stop": false}, {"title": "Killorglin → Caragh Lake", "road": "Killorglin · Richtung Ring of Kerry / Caragh Lake", "nav": "Nach Hotelangabe: Über die Steinbrücke nach Killorglin, durch Lower Bridge Street, rechts in Upper Bridge Street halten; dann links auf Iveragh Road/Ring of Kerry. Nach rund 2 Meilen auf die Beschilderung Caragh Lake / Ard na Sidhe achten. Trotzdem aktuelle Navi-Führung verwenden.", "look": "Jetzt beginnt der schönste Teil des Ankunftstages. Die Bebauung wird dünner und die Berge wirken deutlich näher.", "story": "Die Iveragh Peninsula ist das Herz des Ring of Kerry. Eiszeitliche Gletscher haben hier Täler ausgeschürft und Seen hinterlassen. Caragh Lake liegt eingebettet zwischen Bergen und bewaldeten Hängen – ein sehr anderer Abschluss als ein Stadthotel.", "extra": "Ab hier lieber langsamer und ohne Zeitdruck fahren. Schmale Straßen und entgegenkommende Fahrzeuge gehören zum ländlichen Irland dazu.", "stop": false}, {"title": "Ankunft · Ard na Sidhe", "road": "Caragh Lake · V93 HV57", "nav": "Der Beschilderung Ard na Sidhe folgen. Zieladresse: Ard na Sidhe Country House, Caragh Lake, Killorglin, Co. Kerry, V93 HV57.", "look": "Caragh Lake und die bewaldete Uferlandschaft bilden den Abschluss eurer ersten Querung Irlands.", "story": "Ard na Sidhe bedeutet sinngemäß 'Höhe der Feen'. Das Landhaus wurde im frühen 20. Jahrhundert errichtet und liegt heute in einer parkartigen Anlage direkt am Caragh Lake. Nach Flughafen, Autobahn, Midlands und Kerry seid ihr innerhalb eines Tages durch mehrere völlig unterschiedliche irische Landschaftsräume gereist.", "extra": "Roadbook für heute beenden, Schlüssel holen – und den Rest des Abends nicht mehr mit Kilometern verbringen.", "stop": false}]}, {"id": "tag2", "label": "Tag 2 · 01.09.", "route": "Ring of Kerry", "subtitle": "10:30–19:00 · 17 Etappen", "sections": [{"title": "Start · Ard na Sidhe", "road": "Caragh Lake → Killorglin → N70", "nav": "Abfahrt gegen 10:30 Uhr. Richtung Killorglin, dann N70 nach Glenbeigh/Cahersiveen. Zielzeit zurück im Hotel: 19:00 Uhr.", "look": "See, Wald und Berge begleiten die ersten Kilometer.", "story": "Heute umrundet ihr einen großen Teil der Iveragh Peninsula. Der Ring of Kerry ist weniger eine einzelne Sehenswürdigkeit als eine Folge aus Bergen, Atlantik, kleinen Orten und historischen Landschaften.", "extra": "Valentia Island bleibt heute optional. Die App bevorzugt einen entspannten Tag mit wenigen, guten Stopps.", "stop": false, "time": "10:30", "status": "🟢 Entspannt"}, {"title": "Killorglin & River Laune", "road": "N70 · Richtung Glenbeigh", "nav": "In Killorglin der N70 Richtung Glenbeigh und Cahersiveen folgen.", "look": "Hinter Killorglin öffnet sich die Landschaft Richtung Dingle Bay.", "story": "Killorglin ist für die Puck Fair bekannt, ein altes Volksfest mit einem symbolisch gekrönten Ziegenbock. Der River Laune verbindet die Seen von Killarney mit Dingle Bay.", "extra": "Heute bleibt Killorglin nur Durchgangsort; der Schwerpunkt liegt weiter westlich an der Küste.", "stop": false, "time": "10:45", "status": "🟢 Entspannt"}, {"title": "Glenbeigh & Rossbeigh", "road": "N70 · Glenbeigh", "nav": "Bei gutem Wetter kurzer Abstecher Richtung Rossbeigh Beach; danach zurück zur N70 Richtung Cahersiveen.", "look": "Langer Sandstrand, Dingle Bay und gegenüber die Dingle Peninsula.", "story": "Rossbeigh liegt auf einer langen Sandnehrung. Wind, Wellen und Strömungen formen diese Küstenlandschaft ständig neu.", "extra": "Nur 15–20 Minuten einplanen. Erster Meeresblick, kein langer Strandspaziergang.", "stop": true, "time": "11:05", "status": "🟢 Entspannt"}, {"title": "Glenbeigh → Cahersiveen", "road": "N70 · entlang Dingle Bay", "nav": "Auf der N70 bleiben.", "look": "Meerblicke wechseln mit Bergen, Weiden und verstreuten Höfen.", "story": "Die Iveragh Peninsula war über Jahrhunderte dünn besiedelt. Kleine Felder, Steinmauern und Höfe erzählen von Landwirtschaft unter schwierigen Bedingungen.", "extra": "Achtet auf die kleinteilige Feldstruktur – sie ist ein sichtbares Stück Sozial- und Besitzgeschichte.", "stop": false, "time": "11:30", "status": "🟢 Entspannt"}, {"title": "Cahersiveen · Daniel O’Connell", "road": "N70 · Cahersiveen", "nav": "Kurzer Halt möglich. Danach weiter Richtung Portmagee/Skellig Ring.", "look": "Cahersiveen liegt am Fertha River mit Blick Richtung Valentia Harbour.", "story": "Die Gegend ist eng mit Daniel O’Connell, dem 'Liberator', verbunden. Er kämpfte im 19. Jahrhundert für die katholische Emanzipation und prägte die irische Politik lange vor der Unabhängigkeitsbewegung.", "extra": "Cahergall Stone Fort ist eine gute Zusatzoption, aber heute nur, wenn ihr im Zeitplan seid.", "stop": true, "time": "12:00", "status": "🟢 Entspannt"}, {"title": "Skellig Ring beginnt", "road": "Cahersiveen → Portmagee", "nav": "Panoramaroute über Portmagee und Skellig Ring nehmen. Valentia Island nicht zusätzlich umrunden.", "look": "Die Straße wird schmaler und die Atlantikküste dramatischer.", "story": "Der Skellig Ring führt näher an abgelegene Buchten und Küstenlandschaften als die größere Ring-of-Kerry-Hauptroute.", "extra": "Wenn ihr diesen Punkt deutlich nach 12:45 erreicht, Zusatzstopps streichen.", "stop": false, "time": "12:30", "status": "🟢 Entspannt"}, {"title": "Portmagee & Skellig Michael", "road": "Portmagee · Skellig Ring", "nav": "Durch Portmagee Richtung Ballinskelligs folgen.", "look": "Blicke Richtung Valentia und auf die offene Atlantikküste.", "story": "Auf Skellig Michael lebten frühchristliche Mönche in großer Abgeschiedenheit. Ihre Steinhütten hoch über dem Atlantik gehören zu den eindrucksvollsten Zeugnissen frühmittelalterlichen Mönchslebens in Europa.", "extra": "Abgeschiedenheit war religiös gewollt, praktisch aber extrem anspruchsvoll: Wasser, Nahrung und Schutz mussten auf einem nackten Felsen organisiert werden.", "stop": false, "time": "12:50", "status": "🟢 Entspannt"}, {"title": "St Finian’s Bay", "road": "Skellig Ring · Küstenabschnitt", "nav": "Skellig-Ring-Route weiter folgen. Langsam fahren; Straße teils schmal und kurvig.", "look": "Bei klarer Sicht erscheinen die Skelligs wie dunkle Zacken am Horizont.", "story": "Harte Gesteine und der Atlantik formen hier Klippen, Buchten und Geröllstrände. Die Landschaft wirkt rau, obwohl sie geologisch sehr langsam entsteht.", "extra": "Nur an sicheren Haltepunkten anhalten. Fahrer konzentriert sich auf die Straße, Beifahrer auf die Aussicht.", "stop": false, "time": "13:10", "status": "🟢 Entspannt"}, {"title": "Ballinskelligs · Café & Meer", "road": "Ballinskelligs Beach", "nav": "Jetzt längste geplante Pause. Danach Richtung Waterville weiter.", "look": "Sandstrand und offene Atlantikküste – ideal für eine ruhige Pause.", "story": "Ballinskelligs verbindet Küstenlandschaft, alte kirchliche Spuren und eine kleine ländliche Gemeinschaft. Genau hier soll der Tag bewusst langsamer werden.", "extra": "Etwa 45–55 Minuten für Kaffee, etwas Kleines und Strandblick. Das ist der Haupt-Café-Stopp des Tages.", "stop": true, "time": "13:30", "status": "🟢 Entspannt"}, {"title": "Waterville", "road": "N70 · Waterville", "nav": "Zurück Richtung N70 und kurzer Halt an der Promenade möglich.", "look": "Waterville liegt zwischen Atlantik und Lough Currane.", "story": "Charlie Chaplin verbrachte mit seiner Familie mehrfach Ferien in Waterville; eine Statue erinnert heute daran.", "extra": "15–20 Minuten reichen. Wenn Ballinskelligs länger war, einfach durchfahren.", "stop": true, "time": "14:35", "status": "🟢 Entspannt"}, {"title": "Waterville → Caherdaniel", "road": "N70 · Küstenstraße", "nav": "Auf der N70 Richtung Caherdaniel und Sneem bleiben.", "look": "Atlantikblicke, Buchten und Bergflanken wechseln sich ab.", "story": "Die Südwestseite der Halbinsel ist stärker dem Atlantik ausgesetzt. Deshalb ändern sich Licht und Wetter hier oft besonders schnell.", "extra": "Auch bei Wolken lohnt die Strecke – gerade dann wirkt Kerry oft dramatisch.", "stop": false, "time": "15:00", "status": "🟢 Entspannt"}, {"title": "Derrynane", "road": "Caherdaniel · Derrynane", "nav": "Abzweig nach Derrynane nur nehmen, wenn ihr ungefähr im Plan seid. Danach zurück zur N70 Richtung Sneem.", "look": "Geschützte Bucht, Strand, Dünen und Parklandschaft.", "story": "Derrynane war das Zuhause Daniel O’Connells. Die Umgebung verbindet persönliche Familiengeschichte mit der politischen Geschichte Irlands.", "extra": "35–45 Minuten. Kein Pflicht-Café; lieber kurzer Spaziergang und Landschaft.", "stop": true, "time": "15:30", "status": "🟡 Zeit im Blick"}, {"title": "Caherdaniel → Sneem", "road": "N70 · Richtung Sneem", "nav": "Zurück auf die N70 und Richtung Sneem.", "look": "Die Küste tritt zurück, Berge und kleine Täler werden wieder wichtiger.", "story": "Viele Ortsnamen dieser Gegend stammen aus dem Irischen und beschreiben Gelände, Wasser, Heilige oder alte Familien – eine historische Landschaftskarte in Sprache.", "extra": "Wer Namen bewusst liest, entdeckt oft Hinweise auf Ringforts, Kirchen, Berge oder Flüsse.", "stop": false, "time": "16:15", "status": "🟡 Zeit im Blick"}, {"title": "Sneem", "road": "N70 · Sneem", "nav": "Kurzer Ortsbummel. Spätestens gegen 17:00–17:10 weiterfahren.", "look": "Farbenfroher kleiner Ort am Sneem River zwischen Bergen und Küste.", "story": "Sneem war lange lokales Markt- und Versorgungszentrum und ist heute ein beliebter Ring-of-Kerry-Stopp.", "extra": "15–20 Minuten. Kein weiterer langer Caféhalt mehr.", "stop": true, "time": "16:40", "status": "🟡 Zeit im Blick"}, {"title": "Rückfahrt", "road": "Sneem → Ard na Sidhe", "nav": "Jetzt aktuelle Navi-Route direkt zurück zum Hotel verwenden und keine langen Zusatzstopps mehr einbauen.", "look": "Die Landschaft wechselt wieder von offener Küste zu Bergen, Tälern und Seen.", "story": "Der Ring of Kerry ist landschaftlich keine homogene Runde, sondern eine Abfolge verschiedener Welten: Dingle Bay, Atlantik, Südwestküste und schließlich wieder geschütztere Berg- und Seenlandschaft.", "extra": "Wenn es nach 17:15 ist: direkt zum Hotel, keine Zusatzschleifen.", "stop": false, "time": "17:05", "status": "🟡 Zeit im Blick"}, {"title": "Letzte Stunde", "road": "Richtung Caragh Lake", "nav": "Navi auf Ard na Sidhe, V93 HV57. Direkte Route ohne weitere Stopps.", "look": "Je näher Caragh Lake kommt, desto ruhiger und grüner wird die Umgebung.", "story": "Nach einem Tag an der offenen Atlantikküste wirkt Caragh Lake wie ein geschützter Gegenpol.", "extra": "Wenn ihr etwa 18:00–18:15 hier seid, passt alles sehr gut.", "stop": false, "time": "18:00", "status": "🔴 Direkt zum Hotel"}, {"title": "Ankunft · Ard na Sidhe", "road": "Caragh Lake · V93 HV57", "nav": "Der Beschilderung zum Hotel folgen. Geplante Ankunft: etwa 18:45–19:00 Uhr.", "look": "Zurück am See endet der Ring-of-Kerry-Tag wieder in stiller Landschaft.", "story": "Heute habt ihr Dingle Bay, Skellig Coast, Atlantik, Derrynane und die kleinen Orte des Südens erlebt. Die Landschaft selbst war das Hauptprogramm.", "extra": "Roadbook für heute beenden und den Abend genießen.", "stop": false, "time": "18:45–19:00", "status": "🏨 Ziel"}]}];let day=null,i=0,talking=false;
function build(){const homeEl=document.getElementById("home");homeEl.innerHTML="";days.forEach(d=>{let n=+(localStorage.getItem("ireland-"+d.id)||0),x=document.createElement("div");x.className="card day";x.innerHTML=`<div class=daytitle>${d.label}</div><div class=route>${d.route}</div><div class=small>${d.subtitle}</div><div class=small style="margin-top:8px">▶ ${n?"Fortsetzen bei Etappe "+(n+1):"Roadbook öffnen"}</div>`;x.onclick=()=>openDay(d.id);homeEl.appendChild(x)})}
function openDay(id){day=days.find(d=>d.id===id);i=+(localStorage.getItem("ireland-"+id)||0);document.getElementById("home").classList.add("hidden");document.getElementById("book").classList.remove("hidden");document.getElementById("ctrl").classList.remove("hidden");document.getElementById("prog").classList.remove("hidden");title.textContent=day.route;sub.textContent=day.label+" · "+day.subtitle;render()}
function goHome(){stopSpeech();day=null;book.classList.add("hidden");ctrl.classList.add("hidden");prog.classList.add("hidden");document.getElementById("home").classList.remove("hidden");title.textContent="Roadbook";sub.textContent="Wählt einen Reisetag";build();scrollTo(0,0)}
function render(){let s=day.sections[i];sec.textContent=s.title;road.textContent=s.road;nav.textContent=s.nav;look.textContent=s.look;story.textContent=s.story;extraText.textContent=s.extra;extra.classList.remove("show");stop.classList.toggle("hidden",!s.stop);count.textContent=`Etappe ${i+1} von ${day.sections.length}`;bar.style.width=((i+1)/day.sections.length*100)+"%";localStorage.setItem("ireland-"+day.id,i);if(s.time){time.classList.remove("hidden");status.textContent=s.status;clock.textContent="Orientierungszeit: "+s.time+" · Rückkehrziel 19:00 Uhr"}else time.classList.add("hidden");scrollTo({top:0,behavior:"smooth"});stopSpeech()}
function next(){if(i<day.sections.length-1){i++;render()}}function prev(){if(i>0){i--;render()}}function toggleExtra(){extra.classList.toggle("show")}
function stopSpeech(){if("speechSynthesis"in window)speechSynthesis.cancel();talking=false;speak.textContent="🔊 Vorlesen"}
function speak(){if(talking){stopSpeech();return}let s=day.sections[i],u=new SpeechSynthesisUtterance((s.time?`Zeitstatus. ${s.status}. Orientierung ${s.time}. `:"")+`Navigation. ${s.nav}. Was ihr jetzt seht. ${s.look}. Geschichte. ${s.story}.`+(extra.classList.contains("show")?` Mehr wissen. ${s.extra}`:""));u.lang="de-DE";u.rate=.94;u.onend=()=>{talking=false;speak.textContent="🔊 Vorlesen"};talking=true;speak.textContent="⏹ Stoppen";speechSynthesis.speak(u)}
function hotel(){window.open("https://maps.apple.com/?q=Ard+na+Sidhe+Country+House,+Caragh+Lake,+Killorglin,+V93+HV57","_blank")}
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./service-worker.js?v=3").catch(()=>{});build();
