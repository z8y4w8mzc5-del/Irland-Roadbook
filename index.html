<script>
const days=[{"id": "tag1", "label": "Tag 1 · 31.08.", "route": "Dublin Airport → Ard na Sidhe", "subtitle": "Anreise · 16 Etappen", "sections": [{"title": "Start · Dublin Airport", "road": "Mietwagenzentrum → M50", "nav": "Bevor ihr losfahrt: Sitz, Spiegel und Fahrzeugbreite prüfen. Navi auf Ard na Sidhe, V93 HV57 stellen. Beim Vermieter klären, wie die M50-Maut abgerechnet wird.", "look": "Die ersten Kilometer sind Eingewöhnung. Fahrer konzentriert sich auf Linksverkehr; Beifahrer übernimmt Navi und Roadbook.", "story": "Willkommen in Irland. Dublin liegt an der Ostküste, aber heute durchquert ihr fast die ganze Insel bis in den Südwesten. Die Fahrt zeigt sehr schön, wie sich Irland von der dichter besiedelten Hauptstadtregion über die landwirtschaftlich geprägten Midlands bis zu den Bergen und Seen Kerrys verändert.", "extra": "M50-Maut: Die M50 arbeitet im mautpflichtigen Abschnitt ohne Schranken. Bei Mietwagen kann die Abrechnung je nach Vermieter unterschiedlich laufen. Deshalb ist die Frage am Schalter wichtiger als späteres Rätselraten.", "stop": false}, {"title": "Dublin umfahren", "road": "M50 · Richtung Süden", "nav": "Auf der M50 den Schildern Richtung Süden folgen. Das Navi hat hier Vorrang, weil Verkehr und Anschlussrouten variieren können.", "look": "Ihr umfahrt die Innenstadt westlich. An klaren Tagen zeichnen sich südlich die Wicklow Mountains ab.", "story": "Dublin wuchs an der Mündung des Liffey. Der irische Name Baile Átha Cliath bedeutet ungefähr 'Ort an der Furt der Flechtwerkhürden'. Der englische Name Dublin geht dagegen auf Dubh Linn, den 'schwarzen Teich', zurück. Schon an einem einzigen Ortsnamen sieht man, wie gälische und englische Geschichte nebeneinanderliegen.", "extra": "Beifahrer-Tipp: Auf Autobahnen sind Entfernungen in Kilometern und Geschwindigkeiten in km/h angegeben. Irische Wegweiser verwenden für Orte häufig die englische und die irische Namensform.", "stop": false}, {"title": "Auf die M7", "road": "M50 → M7 · Richtung Limerick", "nav": "Beim Wechsel auf die M7 ausdrücklich Richtung Limerick orientieren. Ab hier wird die Navigation für längere Zeit ruhiger.", "look": "Die dichte Hauptstadtregion lockert sich. Gewerbegebiete weichen Feldern, Hecken und kleineren Siedlungen.", "story": "Die M7 folgt grob einer der wichtigsten historischen Achsen von Dublin in den Südwesten. Moderne Autobahn und alte Reisewege liegen nicht identisch, aber die Logik ist dieselbe: Von der Ostküste führt der natürliche Verkehrskorridor durch die Midlands zum Shannon und weiter nach Munster.", "extra": "Irische Hecken sind nicht bloß Grundstücksgrenzen. Viele bilden alte Feldstrukturen ab und schaffen ein dichtes Netz aus kleinen Lebensräumen.", "stop": false}, {"title": "Kildare & The Curragh", "road": "M7 · County Kildare", "nav": "Auf der M7 bleiben. Kein Straßenwechsel nötig.", "look": "Achtet auf weite, offene Grasflächen. Die Gegend um Kildare und The Curragh ist eng mit Pferdezucht und Rennsport verbunden.", "story": "The Curragh ist eine große offene Ebene in County Kildare. Seit Jahrhunderten wird sie mit Pferden verbunden; heute ist Kildare eines der Zentren der irischen Vollblutzucht. Gleichzeitig war The Curragh auch militärisch bedeutend. Diese ungewöhnliche Mischung aus offenem Grasland, Pferdekultur und Militärgeschichte prägt die Region.", "extra": "Der Name Kildare stammt vom irischen Cill Dara: 'Kirche der Eiche'. Er erinnert an die heilige Brigid, eine der wichtigsten Gestalten des frühen irischen Christentums.", "stop": false}, {"title": "Midlands & Moore", "road": "M7 · Richtung Portlaoise", "nav": "Weiter auf der M7. Rock of Dunamase bleibt bis zur Entscheidung nur eine Option.", "look": "Die Landschaft wirkt flacher und weiter. In den Midlands liegen große Moorgebiete, darunter Teile des Bog of Allen.", "story": "Irlands Moore sind Landschaftsarchive. Über Jahrtausende sammelten sich Pflanzenreste in nassem, sauerstoffarmem Boden und wurden zu Torf. Torf war lange Brennstoff und Teil des Alltags. Heute stehen viele Moore im Mittelpunkt des Naturschutzes und der Renaturierung.", "extra": "Moore konservieren außergewöhnlich gut. Pollen, Holz und manchmal sogar menschliche Überreste erlauben Archäologen und Klimaforschern Einblicke weit zurück in die Vergangenheit.", "stop": false}, {"title": "Entscheidung · Rock of Dunamase", "road": "M7 · Raum Portlaoise", "nav": "Jetzt entscheiden: Rock of Dunamase besuchen oder auf der M7 bleiben. Für den Abstecher unbedingt die aktuelle Navi-Führung verwenden.", "look": "Der markante Kalksteinfelsen erhebt sich deutlich aus der Landschaft östlich von Portlaoise.", "story": "Dunamase war zunächst ein frühchristlicher Platz und wurde später zu einer der bedeutenden anglo-normannischen Festungen Irlands. 1170 gelangte Dunamase im Zusammenhang mit der Heirat von Aoife MacMurrough und Richard de Clare, bekannt als Strongbow, in die anglo-normannische Machtwelt.", "extra": "Die Lage erklärt fast alles: Von dem Felsen lässt sich das Umland hervorragend überblicken. Wer im Mittelalter Wege, Menschen und Vieh kontrollieren wollte, brauchte genau solche Plätze.", "stop": true}, {"title": "Nach Dunamase zurück zur Route", "road": "Zurück → M7 · Richtung Limerick", "nav": "Nach dem Besuch zurück zur M7 und ausdrücklich Richtung Limerick fahren. Nicht der Gegenrichtung Dublin folgen.", "look": "Beim Zurückfahren lohnt ein letzter Blick auf den Felsen: Aus der Ebene wirkt die strategische Lage besonders deutlich.", "story": "Die Ruinen erzählen keine einzige Epoche, sondern mehrere übereinanderliegende Geschichten: frühes Christentum, Wikingerzeit, irische Königtümer, normannische Expansion und spätere Zerstörungen. Genau diese Überlagerung ist typisch für historische Orte in Irland.", "extra": "Am Monument gibt es nur begrenzte Parkmöglichkeiten. Auf der schmalen Straße rund um den Zugang ist besondere Vorsicht nötig.", "stop": false}, {"title": "M7/M8-Verzweigung", "road": "M7 · Richtung Limerick", "nav": "Wichtig: An der großen Verzweigung auf der M7 Richtung Limerick bleiben. Die M8 führt Richtung Cork.", "look": "Ihr seid nun tief in den Midlands. Die Landschaft bleibt landwirtschaftlich, wird aber nach Westen langsam abwechslungsreicher.", "story": "Hier teilt sich der Verkehr in zwei große Südwestkorridore: Cork im Süden und Limerick/Shannon im Westen. Für eure Reise ist Limerick das Tor nach Kerry.", "extra": "Auf diesem Autobahnabschnitt liegt eine Mautstation. Für Pkw beträgt die M7/M8-Maut 2026 laut Transport Infrastructure Ireland 2,30 Euro.", "stop": false}, {"title": "Richtung Shannon", "road": "M7 · Counties Tipperary/Limerick", "nav": "Auf der M7 Richtung Limerick bleiben.", "look": "Westwärts werden Hügel und Höhenzüge sichtbarer. Ihr nähert euch dem Einzugsgebiet des Shannon.", "story": "Der Shannon ist der längste Fluss Irlands und seit jeher Verkehrsweg, Grenze und Landschaftsachse. Limerick entstand an einer strategisch wichtigen Stelle am Fluss, wo sich Handel, Verteidigung und später Industrie konzentrierten.", "extra": "Viele irische Landschaften versteht man besser über Wasser als über Straßen: Flüsse, Seen, Moore und die Atlantikküste bestimmten lange, wo Menschen siedelten und wie sie reisten.", "stop": false}, {"title": "Limerick", "road": "Umfahrung Limerick → Richtung N21/Kerry", "nav": "Der aktuellen Navi-Führung Richtung Kerry/Tralee folgen. Nicht in die Innenstadt fahren, sofern ihr keinen bewussten Stopp plant.", "look": "In der Region dominiert der Shannon. Je nach Route seht ihr Stadtgebiete, Flusslandschaft und die westlichen Ausläufer der Grafschaft.", "story": "Limerick entwickelte sich aus einer Wikingersiedlung und wurde später zu einer bedeutenden normannischen Stadt. King John's Castle erinnert an diese mittelalterliche Machtstellung. Die Stadt war außerdem Schauplatz der Williamitenkriege des 17. Jahrhunderts und ist deshalb eng mit dem 'Treaty of Limerick' verbunden.", "extra": "Heute ist Limerick die wichtigste Stadt im mittleren Westen Irlands. Für euren Ankunftstag dient sie vor allem als geografischer Wendepunkt: Ab hier fühlt sich die Reise zunehmend nach Westirland an.", "stop": false}, {"title": "Adare", "road": "N21 · westlich von Limerick", "nav": "Auf der N21 Richtung Kerry bleiben. Adare nur ansteuern, wenn Zeit und Energie passen.", "look": "Adare ist bekannt für reetgedeckte Cottages, historische Gebäude und ein sehr gepflegtes Ortsbild.", "story": "Adare verdankt einen Teil seines heutigen romantischen Erscheinungsbilds dem 19. Jahrhundert, als die Earls of Dunraven das Dorf prägten. Gleichzeitig reichen Kloster- und Burgspuren viel weiter zurück. Es ist also zugleich historischer Ort und bewusst gestaltetes 'picturesque village'.", "extra": "Wenn ihr spät dran seid, einfach durchfahren. Das Hotelziel am Caragh Lake ist der schönere Ort, um den ersten Reisetag ruhig ausklingen zu lassen.", "stop": true}, {"title": "West Limerick", "road": "N21 · Richtung Abbeyfeale/Kerry", "nav": "Weiter der N21 Richtung Kerry folgen.", "look": "Die Straße führt durch eine stärker ländliche Region. Kleine Orte, Weiden, Hecken und sanfte Hügel bestimmen das Bild.", "story": "West Limerick war traditionell stark landwirtschaftlich geprägt. Je näher ihr Kerry kommt, desto deutlicher verändert sich der Charakter: Die Ebenen und sanften Hügel der Midlands gehen langsam in eine dramatischere, atlantisch geprägte Landschaft über.", "extra": "Ein irisches Landschaftsdetail zum Beobachten: Viele Felder sind klein und von Hecken oder Steinmauern getrennt. Die Parzellen erzählen oft mehr über Besitzgeschichte als eine moderne Landkarte.", "stop": false}, {"title": "Willkommen in Kerry", "road": "N21/N23 · Richtung Castleisland", "nav": "Den Navi-Hinweisen Richtung Castleisland und anschließend Richtung Killorglin folgen. Ab hier können Straßenwechsel häufiger werden.", "look": "Berge rücken näher. Kerry wirkt grüner, bewegter und deutlich stärker vom Atlantik geprägt.", "story": "County Kerry ist eines der landschaftlich spektakulärsten Gebiete Irlands. Die Berge bestehen zu großen Teilen aus sehr altem Gestein; Eiszeiten formten Täler und Seen. Im Südwesten liegen die höchsten Berge der Insel, darunter Carrauntoohil.", "extra": "Kerry heißt auf Irisch Ciarraí, benannt nach dem alten Volk der Ciarraige. Viele Ortsnamen, die ihr jetzt seht, tragen die gälische Sprachgeschichte noch deutlich in sich.", "stop": false}, {"title": "Richtung Killorglin", "road": "Region Castleisland → Killorglin", "nav": "Aktuelle Navigation nach Killorglin folgen. Hier nicht mehr nur nach einer einzelnen Straßennummer fahren.", "look": "Jetzt wird die Landschaft zum Auftakt der Iveragh Peninsula: Berge, tiefe Täler und im Westen der Einfluss des Atlantiks.", "story": "Killorglin liegt am River Laune, der aus den Seen von Killarney Richtung Dingle Bay fließt. Der Ort ist besonders für die Puck Fair bekannt, ein traditionsreiches Fest, bei dem symbolisch ein Ziegenbock zum 'King Puck' gekrönt wird.", "extra": "Für euch ist Killorglin heute das letzte größere Orientierungszentrum. Danach wird die Fahrt zum Caragh Lake ruhiger und ländlicher.", "stop": false}, {"title": "Killorglin → Caragh Lake", "road": "Killorglin · Richtung Ring of Kerry / Caragh Lake", "nav": "Nach Hotelangabe: Über die Steinbrücke nach Killorglin, durch Lower Bridge Street, rechts in Upper Bridge Street halten; dann links auf Iveragh Road/Ring of Kerry. Nach rund 2 Meilen auf die Beschilderung Caragh Lake / Ard na Sidhe achten. Trotzdem aktuelle Navi-Führung verwenden.", "look": "Jetzt beginnt der schönste Teil des Ankunftstages. Die Bebauung wird dünner und die Berge wirken deutlich näher.", "story": "Die Iveragh Peninsula ist das Herz des Ring of Kerry. Eiszeitliche Gletscher haben hier Täler ausgeschürft und Seen hinterlassen. Caragh Lake liegt eingebettet zwischen Bergen und bewaldeten Hängen – ein sehr anderer Abschluss als ein Stadthotel.", "extra": "Ab hier lieber langsamer und ohne Zeitdruck fahren. Schmale Straßen und entgegenkommende Fahrzeuge gehören zum ländlichen Irland dazu.", "stop": false}, {"title": "Ankunft · Ard na Sidhe", "road": "Caragh Lake · V93 HV57", "nav": "Der Beschilderung Ard na Sidhe folgen. Zieladresse: Ard na Sidhe Country House, Caragh Lake, Killorglin, Co. Kerry, V93 HV57.", "look": "Caragh Lake und die bewaldete Uferlandschaft bilden den Abschluss eurer ersten Querung Irlands.", "story": "Ard na Sidhe bedeutet sinngemäß 'Höhe der Feen'. Das Landhaus wurde im frühen 20. Jahrhundert errichtet und liegt heute in einer parkartigen Anlage direkt am Caragh Lake. Nach Flughafen, Autobahn, Midlands und Kerry seid ihr innerhalb eines Tages durch mehrere völlig unterschiedliche irische Landschaftsräume gereist.", "extra": "Roadbook für heute beenden, Schlüssel holen – und den Rest des Abends nicht mehr mit Kilometern verbringen.", "stop": false}]}, {"id": "tag2", "label": "Tag 2 · 01.09.", "route": "Ring of Kerry", "subtitle": "10:30–19:00 · 17 Etappen", "sections": [{"title": "Start · Ard na Sidhe", "road": "Caragh Lake → Killorglin → N70", "nav": "Abfahrt gegen 10:30 Uhr. Richtung Killorglin, dann N70 nach Glenbeigh/Cahersiveen. Zielzeit zurück im Hotel: 19:00 Uhr.", "look": "See, Wald und Berge begleiten die ersten Kilometer.", "story": "Heute umrundet ihr einen großen Teil der Iveragh Peninsula. Der Ring of Kerry ist weniger eine einzelne Sehenswürdigkeit als eine Folge aus Bergen, Atlantik, kleinen Orten und historischen Landschaften.", "extra": "Valentia Island bleibt heute optional. Die App bevorzugt einen entspannten Tag mit wenigen, guten Stopps.", "stop": false, "time": "10:30", "status": "🟢 Entspannt"}, {"title": "Killorglin & River Laune", "road": "N70 · Richtung Glenbeigh", "nav": "In Killorglin der N70 Richtung Glenbeigh und Cahersiveen folgen.", "look": "Hinter Killorglin öffnet sich die Landschaft Richtung Dingle Bay.", "story": "Killorglin ist für die Puck Fair bekannt, ein altes Volksfest mit einem symbolisch gekrönten Ziegenbock. Der River Laune verbindet die Seen von Killarney mit Dingle Bay.", "extra": "Heute bleibt Killorglin nur Durchgangsort; der Schwerpunkt liegt weiter westlich an der Küste.", "stop": false, "time": "10:45", "status": "🟢 Entspannt"}, {"title": "Glenbeigh & Rossbeigh", "road": "N70 · Glenbeigh", "nav": "Bei gutem Wetter kurzer Abstecher Richtung Rossbeigh Beach; danach zurück zur N70 Richtung Cahersiveen.", "look": "Langer Sandstrand, Dingle Bay und gegenüber die Dingle Peninsula.", "story": "Rossbeigh liegt auf einer langen Sandnehrung. Wind, Wellen und Strömungen formen diese Küstenlandschaft ständig neu.", "extra": "Nur 15–20 Minuten einplanen. Erster Meeresblick, kein langer Strandspaziergang.", "stop": true, "time": "11:05", "status": "🟢 Entspannt"}, {"title": "Glenbeigh → Cahersiveen", "road": "N70 · entlang Dingle Bay", "nav": "Auf der N70 bleiben.", "look": "Meerblicke wechseln mit Bergen, Weiden und verstreuten Höfen.", "story": "Die Iveragh Peninsula war über Jahrhunderte dünn besiedelt. Kleine Felder, Steinmauern und Höfe erzählen von Landwirtschaft unter schwierigen Bedingungen.", "extra": "Achtet auf die kleinteilige Feldstruktur – sie ist ein sichtbares Stück Sozial- und Besitzgeschichte.", "stop": false, "time": "11:30", "status": "🟢 Entspannt"}, {"title": "Cahersiveen · Daniel O’Connell", "road": "N70 · Cahersiveen", "nav": "Kurzer Halt möglich. Danach weiter Richtung Portmagee/Skellig Ring.", "look": "Cahersiveen liegt am Fertha River mit Blick Richtung Valentia Harbour.", "story": "Die Gegend ist eng mit Daniel O’Connell, dem 'Liberator', verbunden. Er kämpfte im 19. Jahrhundert für die katholische Emanzipation und prägte die irische Politik lange vor der Unabhängigkeitsbewegung.", "extra": "Cahergall Stone Fort ist eine gute Zusatzoption, aber heute nur, wenn ihr im Zeitplan seid.", "stop": true, "time": "12:00", "status": "🟢 Entspannt"}, {"title": "Skellig Ring beginnt", "road": "Cahersiveen → Portmagee", "nav": "Panoramaroute über Portmagee und Skellig Ring nehmen. Valentia Island nicht zusätzlich umrunden.", "look": "Die Straße wird schmaler und die Atlantikküste dramatischer.", "story": "Der Skellig Ring führt näher an abgelegene Buchten und Küstenlandschaften als die größere Ring-of-Kerry-Hauptroute.", "extra": "Wenn ihr diesen Punkt deutlich nach 12:45 erreicht, Zusatzstopps streichen.", "stop": false, "time": "12:30", "status": "🟢 Entspannt"}, {"title": "Portmagee & Skellig Michael", "road": "Portmagee · Skellig Ring", "nav": "Durch Portmagee Richtung Ballinskelligs folgen.", "look": "Blicke Richtung Valentia und auf die offene Atlantikküste.", "story": "Auf Skellig Michael lebten frühchristliche Mönche in großer Abgeschiedenheit. Ihre Steinhütten hoch über dem Atlantik gehören zu den eindrucksvollsten Zeugnissen frühmittelalterlichen Mönchslebens in Europa.", "extra": "Abgeschiedenheit war religiös gewollt, praktisch aber extrem anspruchsvoll: Wasser, Nahrung und Schutz mussten auf einem nackten Felsen organisiert werden.", "stop": false, "time": "12:50", "status": "🟢 Entspannt"}, {"title": "St Finian’s Bay", "road": "Skellig Ring · Küstenabschnitt", "nav": "Skellig-Ring-Route weiter folgen. Langsam fahren; Straße teils schmal und kurvig.", "look": "Bei klarer Sicht erscheinen die Skelligs wie dunkle Zacken am Horizont.", "story": "Harte Gesteine und der Atlantik formen hier Klippen, Buchten und Geröllstrände. Die Landschaft wirkt rau, obwohl sie geologisch sehr langsam entsteht.", "extra": "Nur an sicheren Haltepunkten anhalten. Fahrer konzentriert sich auf die Straße, Beifahrer auf die Aussicht.", "stop": false, "time": "13:10", "status": "🟢 Entspannt"}, {"title": "Ballinskelligs · Café & Meer", "road": "Ballinskelligs Beach", "nav": "Jetzt längste geplante Pause. Danach Richtung Waterville weiter.", "look": "Sandstrand und offene Atlantikküste – ideal für eine ruhige Pause.", "story": "Ballinskelligs verbindet Küstenlandschaft, alte kirchliche Spuren und eine kleine ländliche Gemeinschaft. Genau hier soll der Tag bewusst langsamer werden.", "extra": "Etwa 45–55 Minuten für Kaffee, etwas Kleines und Strandblick. Das ist der Haupt-Café-Stopp des Tages.", "stop": true, "time": "13:30", "status": "🟢 Entspannt"}, {"title": "Waterville", "road": "N70 · Waterville", "nav": "Zurück Richtung N70 und kurzer Halt an der Promenade möglich.", "look": "Waterville liegt zwischen Atlantik und Lough Currane.", "story": "Charlie Chaplin verbrachte mit seiner Familie mehrfach Ferien in Waterville; eine Statue erinnert heute daran.", "extra": "15–20 Minuten reichen. Wenn Ballinskelligs länger war, einfach durchfahren.", "stop": true, "time": "14:35", "status": "🟢 Entspannt"}, {"title": "Waterville → Caherdaniel", "road": "N70 · Küstenstraße", "nav": "Auf der N70 Richtung Caherdaniel und Sneem bleiben.", "look": "Atlantikblicke, Buchten und Bergflanken wechseln sich ab.", "story": "Die Südwestseite der Halbinsel ist stärker dem Atlantik ausgesetzt. Deshalb ändern sich Licht und Wetter hier oft besonders schnell.", "extra": "Auch bei Wolken lohnt die Strecke – gerade dann wirkt Kerry oft dramatisch.", "stop": false, "time": "15:00", "status": "🟢 Entspannt"}, {"title": "Derrynane", "road": "Caherdaniel · Derrynane", "nav": "Abzweig nach Derrynane nur nehmen, wenn ihr ungefähr im Plan seid. Danach zurück zur N70 Richtung Sneem.", "look": "Geschützte Bucht, Strand, Dünen und Parklandschaft.", "story": "Derrynane war das Zuhause Daniel O’Connells. Die Umgebung verbindet persönliche Familiengeschichte mit der politischen Geschichte Irlands.", "extra": "35–45 Minuten. Kein Pflicht-Café; lieber kurzer Spaziergang und Landschaft.", "stop": true, "time": "15:30", "status": "🟡 Zeit im Blick"}, {"title": "Caherdaniel → Sneem", "road": "N70 · Richtung Sneem", "nav": "Zurück auf die N70 und Richtung Sneem.", "look": "Die Küste tritt zurück, Berge und kleine Täler werden wieder wichtiger.", "story": "Viele Ortsnamen dieser Gegend stammen aus dem Irischen und beschreiben Gelände, Wasser, Heilige oder alte Familien – eine historische Landschaftskarte in Sprache.", "extra": "Wer Namen bewusst liest, entdeckt oft Hinweise auf Ringforts, Kirchen, Berge oder Flüsse.", "stop": false, "time": "16:15", "status": "🟡 Zeit im Blick"}, {"title": "Sneem", "road": "N70 · Sneem", "nav": "Kurzer Ortsbummel. Spätestens gegen 17:00–17:10 weiterfahren.", "look": "Farbenfroher kleiner Ort am Sneem River zwischen Bergen und Küste.", "story": "Sneem war lange lokales Markt- und Versorgungszentrum und ist heute ein beliebter Ring-of-Kerry-Stopp.", "extra": "15–20 Minuten. Kein weiterer langer Caféhalt mehr.", "stop": true, "time": "16:40", "status": "🟡 Zeit im Blick"}, {"title": "Rückfahrt", "road": "Sneem → Ard na Sidhe", "nav": "Jetzt aktuelle Navi-Route direkt zurück zum Hotel verwenden und keine langen Zusatzstopps mehr einbauen.", "look": "Die Landschaft wechselt wieder von offener Küste zu Bergen, Tälern und Seen.", "story": "Der Ring of Kerry ist landschaftlich keine homogene Runde, sondern eine Abfolge verschiedener Welten: Dingle Bay, Atlantik, Südwestküste und schließlich wieder geschütztere Berg- und Seenlandschaft.", "extra": "Wenn es nach 17:15 ist: direkt zum Hotel, keine Zusatzschleifen.", "stop": false, "time": "17:05", "status": "🟡 Zeit im Blick"}, {"title": "Letzte Stunde", "road": "Richtung Caragh Lake", "nav": "Navi auf Ard na Sidhe, V93 HV57. Direkte Route ohne weitere Stopps.", "look": "Je näher Caragh Lake kommt, desto ruhiger und grüner wird die Umgebung.", "story": "Nach einem Tag an der offenen Atlantikküste wirkt Caragh Lake wie ein geschützter Gegenpol.", "extra": "Wenn ihr etwa 18:00–18:15 hier seid, passt alles sehr gut.", "stop": false, "time": "18:00", "status": "🔴 Direkt zum Hotel"}, {"title": "Ankunft · Ard na Sidhe", "road": "Caragh Lake · V93 HV57", "nav": "Der Beschilderung zum Hotel folgen. Geplante Ankunft: etwa 18:45–19:00 Uhr.", "look": "Zurück am See endet der Ring-of-Kerry-Tag wieder in stiller Landschaft.", "story": "Heute habt ihr Dingle Bay, Skellig Coast, Atlantik, Derrynane und die kleinen Orte des Südens erlebt. Die Landschaft selbst war das Hauptprogramm.", "extra": "Roadbook für heute beenden und den Abend genießen.", "stop": false, "time": "18:45–19:00", "status": "🏨 Ziel"}]}, {"id": "tag3", "label": "Tag 3 · 02.09.", "route": "Ard na Sidhe → Slea Head → Dingle", "subtitle": "10:00–18:00 · Inch, Slea Head, Sea Life Tour", "sections": [{"title": "Check-out · Ard na Sidhe", "road": "Caragh Lake → Killorglin → Castlemaine", "nav": "Um 10:00 Uhr auschecken. Zunächst Richtung Killorglin, dann Richtung Castlemaine und Dingle Peninsula. Gepäck bleibt heute im Auto – nichts sichtbar liegen lassen.", "look": "Ein letzter Blick auf Caragh Lake; danach wechselt die Reise von der Iveragh- auf die Dingle Peninsula.", "story": "Heute verlasst ihr die Landschaft des Ring of Kerry und fahrt auf die nördlich benachbarte Dingle Peninsula, auf Irisch Corca Dhuibhne. Die Halbinsel gehört zu den stärksten Gaeltacht-Regionen im Südwesten – Irisch ist hier bis heute Alltagssprache.", "extra": "Tagesziel: 15:00 Uhr Sea-Life-Tour einchecken, 15:30 Abfahrt, gegen 18:00 zurück in Dingle. Abendessen 19:30.", "stop": false, "time": "10:00", "status": "🟢 Entspannt"}, {"title": "Killorglin → Castlemaine", "road": "N70 → Richtung Castlemaine", "nav": "Den Schildern Richtung Castlemaine/Dingle folgen. Aktuelle Navigation nutzen; noch nicht Slea Head eingeben.", "look": "Die Berge des Südwestens bleiben im Rückspiegel, während sich vor euch die Dingle Peninsula aufbaut.", "story": "Castlemaine liegt am Kopf der Castlemaine Harbour. Die Bucht ist ein Übergangsraum zwischen Flüssen, Wattflächen und Atlantik und trennt die Iveragh Peninsula von Dingle.", "extra": "Heute lieber Zeit für Inch und Slea Head aufsparen als unterwegs zusätzliche Stopps sammeln.", "stop": false, "time": "10:25", "status": "🟢 Entspannt"}, {"title": "Auf die Dingle Peninsula", "road": "N86/R561 · Richtung Inch", "nav": "Richtung Inch Beach fahren. Straßen können schmaler und kurviger werden; Zeitangaben des Navis nicht zu sportlich interpretieren.", "look": "Slieve Mish Mountains und die lange Küstenlinie der Dingle Peninsula bestimmen nun das Panorama.", "story": "Die Dingle Peninsula ist geologisch alt und wurde während der Eiszeiten stark geformt. Täler, Bergkessel und die heutigen Buchten verdanken ihre Form dem Zusammenspiel aus Gestein, Eis und Atlantik.", "extra": "Der Beifahrer kann jetzt bereits nach irischen Ortsnamen Ausschau halten: In der Gaeltacht begegnen euch viele Schilder auf Irisch.", "stop": false, "time": "10:45", "status": "🟢 Entspannt"}, {"title": "Inch Beach · Strandpause", "road": "Inch / An Inse", "nav": "Zum offiziellen Strand-/Parkbereich fahren. Etwa 35–45 Minuten bleiben; danach weiter Richtung Dingle und Ventry.", "look": "Eine lange Sandzunge ragt in die Dingle Bay. Gegenüber liegen die Berge der Iveragh Peninsula – die Landschaft von gestern aus neuer Perspektive.", "story": "Inch ist trotz des englischen Namens kein winziger Strand. Die Sandnehrung entstand durch Küstenströmungen und Sedimenttransport. Solche dynamischen Küstenformen verändern sich über Jahrzehnte sichtbar.", "extra": "Heute bewusst chillen: Spaziergang, Meer anschauen, keine Sehenswürdigkeitenliste abarbeiten. Gegen 11:35–11:45 weiterfahren.", "stop": true, "time": "11:00", "status": "🟢 Entspannt"}, {"title": "Richtung Slea Head", "road": "Inch → Dingle → R559 → Ventry", "nav": "Durch/um Dingle Richtung Ventry/Ceann Trá. Ab Beginn des Slea Head Drive den lokalen Schildern Slea Head / Wild Atlantic Way im Uhrzeigersinn folgen. Lokale Beschilderung hat Vorrang vor Navi.", "look": "Hinter Dingle öffnet sich Ventry Harbour; danach rückt der offene Atlantik immer näher.", "story": "Der Slea Head Drive heißt auf Irisch Slí Cheann Sléibhe. Die westliche Spitze der Halbinsel ist zugleich eine der irischsprachigsten Gegenden des Landes.", "extra": "Wichtig: Die offizielle Dingle-Peninsula-Empfehlung ist im Uhrzeigersinn über Ventry. Die schmale Route ist kein Ort für hektisches Überholen.", "stop": false, "time": "11:45", "status": "🟢 Entspannt"}, {"title": "Ventry · Ceann Trá", "road": "R559 · Slea Head Drive", "nav": "Weiter den Slea-Head-/Wild-Atlantic-Way-Schildern folgen.", "look": "Ventry besitzt einen langen gebogenen Strand und einen geschützten Naturhafen.", "story": "Ventry Harbour war schon wegen seiner geschützten Lage bedeutend. Weiter westlich wird die Landschaft zunehmend rauer und die Straße enger.", "extra": "Kein langer Stopp nötig – Inch war eure Strandpause. Die Zeit sparen wir für die spektakuläreren Abschnitte weiter westlich.", "stop": false, "time": "12:10", "status": "🟢 Entspannt"}, {"title": "Fahan & alte Steinbauten", "road": "R559 · Richtung Slea Head", "nav": "Auf der ausgeschilderten Slea-Head-Route bleiben. Nur an ausgewiesenen/sicheren Stellen anhalten.", "look": "Trockensteinmauern, steile Hänge und Atlantik liegen dicht nebeneinander.", "story": "Auf der Dingle Peninsula finden sich Clocháns – sogenannte Beehive Huts – aus Trockenmauerwerk. Die Technik kommt ohne Mörtel aus: Steine werden so geschichtet, dass sich die Wände nach innen schließen und ein stabiles Dach bilden.", "extra": "Wenn ihr eine Anlage besucht, maximal 15–20 Minuten. Der heutige Haupttermin ist die Bootstour.", "stop": true, "time": "12:25", "status": "🟢 Entspannt"}, {"title": "Slea Head · Atlantik", "road": "R559 · Ceann Sléibhe", "nav": "Weiter im Uhrzeigersinn. An Engstellen defensiv fahren und lokale Ausweichstellen nutzen.", "look": "Jetzt liegen Atlantik, Blasket Islands und bei klarer Sicht weit im Süden sogar die Skelligs im Blickfeld.", "story": "Slea Head ist einer jener Orte, an denen Irlands westliche Lage unmittelbar spürbar wird. Hinter den Blaskets liegt über Tausende Kilometer fast nur Atlantik bis Nordamerika.", "extra": "Fotostopp nur, wenn sicher möglich. Der Fahrer sollte die Aussicht nicht erzwingen – dafür gibt es den Beifahrer.", "stop": true, "time": "12:45", "status": "🟢 Entspannt"}, {"title": "Coumeenoole Beach", "road": "R559 · Coumeenoole", "nav": "Kurzer Abstecher/Stop nur gemäß lokaler Beschilderung. Danach weiter im Uhrzeigersinn nach Dún Chaoin/Dunquin.", "look": "Kleine dramatische Bucht unter steilen grünen Hängen, direkt gegenüber der Blasket-Welt.", "story": "Coumeenoole und die umliegende Küste wurden durch den Film 'Ryan’s Daughter' international bekannt. Noch eindrucksvoller ist aber die natürliche Bühne: Brandung, Klippen und die vorgelagerten Inseln.", "extra": "20 Minuten reichen. Heute nicht als Badepause einplanen; Strömung und Brandung können stark sein.", "stop": true, "time": "13:00", "status": "🟢 Entspannt"}, {"title": "Dún Chaoin & Great Blasket", "road": "R559 · Dunquin / Dún Chaoin", "nav": "Der Slea-Head-Route Richtung Ballyferriter folgen. Für Aussicht nur sichere Parkmöglichkeiten nutzen.", "look": "Von hier liegen die Blasket Islands besonders präsent vor der Küste.", "story": "Great Blasket war bis 1953 dauerhaft bewohnt. Die kleine irischsprachige Inselgemeinschaft brachte bemerkenswerte Autoren hervor, deren Bücher das Leben in einer abgelegenen Atlantikgemeinschaft dokumentieren. Schließlich machten Abwanderung, Versorgung und medizinische Risiken das dauerhafte Leben immer schwieriger.", "extra": "Die Bootstour später zeigt euch dieselbe Welt vom Wasser. Deshalb hier lieber Aussicht genießen als einen langen Museumsbesuch einbauen.", "stop": true, "time": "13:25", "status": "🟢 Entspannt"}, {"title": "Mittagspause · westliche Halbinsel", "road": "Dunquin/Ballyferriter", "nav": "Jetzt eine einfache Mittagspause einlegen. Spätestens etwa 14:05–14:10 wieder Richtung Dingle fahren.", "look": "Ihr seid mitten in der Gaeltacht, umgeben von Atlantik, Feldern und Bergen.", "story": "Eine Pause hier passt besser als Mittagessen in Dingle: Die Stadt habt ihr heute Abend und morgen früh noch. So bleibt der Tag landschaftlich auf der Halbinsel.", "extra": "Etwa 30–35 Minuten für Kaffee und etwas Leichtes. Kein langes Restaurant-Mittagessen, damit die Bootstour entspannt bleibt.", "stop": true, "time": "13:35", "status": "🟡 Zeit im Blick"}, {"title": "Rückweg Richtung Dingle", "road": "Slea Head Route → Dingle", "nav": "Weiter im Uhrzeigersinn den lokalen Slea-Head-Schildern folgen. Nicht gegen die touristische Fahrtrichtung abkürzen. Ziel jetzt Dingle Marina.", "look": "Über Ballyferriter und die Nordseite verändern sich die Perspektiven; Mount Brandon prägt den Horizont.", "story": "Mount Brandon ist einer der höchsten Berge Irlands und seit Jahrhunderten Pilgerlandschaft. Der Name erinnert an den heiligen Brendan, um dessen legendäre Seereise sich zahlreiche Geschichten ranken.", "extra": "Ab jetzt keine spontanen längeren Stopps mehr. Für die 15:30-Tour solltet ihr gegen 15:00 am Anbieter sein.", "stop": false, "time": "14:10", "status": "🟡 Zeit im Blick"}, {"title": "Dingle Marina · Boot einchecken", "road": "Dingle Harbour / Marina", "nav": "Zum vereinbarten Treffpunkt von Blasket Islands Sea Life Tours. Parkzeit mit einkalkulieren. Anbieter empfiehlt 30 Minuten vor Abfahrt da zu sein.", "look": "Dingle Harbour ist ein geschützter Hafen; von hier öffnet sich die Fahrt hinaus in die Dingle Bay und Richtung Blaskets.", "story": "Häfen wie Dingle waren jahrhundertelang Verbindungspunkte zwischen lokaler Fischerei, Handel und dem offenen Atlantik. Heute kommt die touristische Nutzung hinzu, ohne dass der maritime Charakter verschwunden ist.", "extra": "Warme Kleidung mitnehmen. Wasserdichte Ausrüstung und Schwimmwesten werden laut Anbieter gestellt. Alle Fahrten hängen von sicheren Wetterbedingungen ab.", "stop": false, "time": "15:00", "status": "🔴 Termin"}, {"title": "Sea Life Tour · Blasket Islands", "road": "Boot · Dingle → Blasket Islands → Dingle", "nav": "15:30 geplante Abfahrt. Die Tour dauert laut Anbieter etwa 2,5 Stunden; alle Fahrten wetterabhängig.", "look": "Jetzt seht ihr die Küste, die ihr eben gefahren seid, vom Meer aus – Klippen, Slea Head und die Blasket Islands.", "story": "Vom Wasser wird verständlich, wie isoliert die Blasket-Gemeinschaft tatsächlich war. Gleichzeitig ist dieses Meer Lebensraum für Robben, Delfine, Wale und zahlreiche Seevögel – Sichtungen sind Natur und deshalb nie garantiert.", "extra": "Der Anbieter nennt 2,5–3 Stunden Dauer. Wenn Wetter oder Tourbetrieb Änderungen erzwingen, hat der Bootstermin Vorrang vor weiteren Roadbook-Punkten.", "stop": false, "time": "15:30–18:00", "status": "🌊 Sea Safari"}, {"title": "Ankunft in Dingle", "road": "Dingle Marina → Unterkunft", "nav": "Nach der Bootstour direkt zur Unterkunft fahren/gehen und einchecken. Kein weiteres Tagesprogramm nötig.", "look": "Jetzt gehört der Abend Dingle – Hafen, bunte Häuser und die kompakte Innenstadt liegen nah beieinander.", "story": "Dingle heißt auf Irisch Daingean Uí Chúis. Die Stadt ist ein kleines regionales Zentrum, zugleich Fischereihafen und einer der bekanntesten Orte an der Westküste.", "extra": "Ziel: etwa 18:00. Danach 90 Minuten ohne Roadbook – einchecken, frisch machen, entspannen.", "stop": false, "time": "18:00", "status": "🏨 Dingle"}, {"title": "Abend · Ashes", "road": "Dingle", "nav": "Für 19:30 Uhr zum Abendessen bei Ashes aufbrechen. Weg am besten zu Fuß, sofern eure Unterkunft zentral liegt.", "look": "Am Abend wird Dingle besonders atmosphärisch: kleine Straßen, Pubs, Hafen und viel Leben auf engem Raum.", "story": "Den Ort selbst müsst ihr heute nicht mehr 'besichtigen'. Dafür habt ihr den Abend und Donnerstagmorgen. Heute endet der Reisetag bewusst mit Essen statt mit einer weiteren Sehenswürdigkeit.", "extra": "Roadbook beenden. Tag 4 kann am Donnerstagmorgen mit einem kleinen Dingle-Kapitel starten.", "stop": false, "time": "19:30", "status": "🍽️ Abendessen"}]}];let day=null,i=0,talking=false;
function build(){const homeEl=document.getElementById("home");homeEl.innerHTML="";days.forEach(d=>{let n=+(localStorage.getItem("ireland-"+d.id)||0),x=document.createElement("div");x.className="card day";x.innerHTML=`<div class=daytitle>${d.label}</div><div class=route>${d.route}</div><div class=small>${d.subtitle}</div><div class=small style="margin-top:8px">▶ ${n?"Fortsetzen bei Etappe "+(n+1):"Roadbook öffnen"}</div>`;x.onclick=()=>openDay(d.id);homeEl.appendChild(x)})}
function openDay(id){day=days.find(d=>d.id===id);i=+(localStorage.getItem("ireland-"+id)||0);document.getElementById("home").classList.add("hidden");document.getElementById("book").classList.remove("hidden");document.getElementById("ctrl").classList.remove("hidden");document.getElementById("prog").classList.remove("hidden");title.textContent=day.route;sub.textContent=day.label+" · "+day.subtitle;render()}
function goHome(){stopSpeech();day=null;book.classList.add("hidden");ctrl.classList.add("hidden");prog.classList.add("hidden");document.getElementById("home").classList.remove("hidden");title.textContent="Roadbook";sub.textContent="Wählt einen Reisetag";build();scrollTo(0,0)}
function render(){let s=day.sections[i];sec.textContent=s.title;road.textContent=s.road;nav.textContent=s.nav;look.textContent=s.look;story.textContent=s.story;extraText.textContent=s.extra;extra.classList.remove("show");stop.classList.toggle("hidden",!s.stop);count.textContent=`Etappe ${i+1} von ${day.sections.length}`;bar.style.width=((i+1)/day.sections.length*100)+"%";localStorage.setItem("ireland-"+day.id,i);if(s.time){time.classList.remove("hidden");status.textContent=s.status;clock.textContent="Orientierungszeit: "+s.time+" · Rückkehrziel 19:00 Uhr"}else time.classList.add("hidden");scrollTo({top:0,behavior:"smooth"});stopSpeech()}
function next(){if(i<day.sections.length-1){i++;render()}}function prev(){if(i>0){i--;render()}}function toggleExtra(){extra.classList.toggle("show")}
function stopSpeech(){if("speechSynthesis"in window)speechSynthesis.cancel();talking=false;speak.textContent="🔊 Vorlesen"}
function speak(){if(talking){stopSpeech();return}let s=day.sections[i],u=new SpeechSynthesisUtterance((s.time?`Zeitstatus. ${s.status}. Orientierung ${s.time}. `:"")+`Navigation. ${s.nav}. Was ihr jetzt seht. ${s.look}. Geschichte. ${s.story}.`+(extra.classList.contains("show")?` Mehr wissen. ${s.extra}`:""));u.lang="de-DE";u.rate=.94;u.onend=()=>{talking=false;speak.textContent="🔊 Vorlesen"};talking=true;speak.textContent="⏹ Stoppen";speechSynthesis.speak(u)}
